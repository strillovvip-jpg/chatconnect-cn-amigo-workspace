[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chatconnect-ai-worker"
version = "0.1.0"
description = "Model-free LiveKit frame echo worker for ChatConnect"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "livekit>=1.0,<2.0",
  "livekit-agents>=1.5,<2.0",
  "livekit-api>=1.0,<2.0",
  "opencv-python-headless>=4.12,<5.0",
  "pydantic-settings>=2.7,<3.0",
  "psutil>=7.0,<8.0",
  "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1.0",
  "pillow>=11.0,<13.0",
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.25,<1.0",
  "ruff>=0.9,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
