# Template rendered by scripts/deploy-vps.sh. Do not place real secrets here.
server {
    server_name __CN_SERVER_NAMES__;

    root __CN_WEBROOT__;
    index index.html;

    location = /sw.js {
        try_files $uri =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Service-Worker-Allowed "/" always;
        expires -1;
    }

    location = /api/ai/faces {
        proxy_pass https://__CN_CONVEX_SITE_HOST__/api/ai/faces;
        proxy_ssl_server_name on;
        proxy_set_header Host __CN_CONVEX_SITE_HOST__;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /api/ai/swap {
        proxy_pass https://__CN_CONVEX_SITE_HOST__/api/ai/swap;
        proxy_ssl_server_name on;
        proxy_set_header Host __CN_CONVEX_SITE_HOST__;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    listen [::]:443 ssl ipv6only=on;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/__CN_DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__CN_DOMAIN__/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    listen [::]:80;
    server_name __CN_SERVER_NAMES__;
    return 301 https://__CN_DOMAIN__$request_uri;
}
